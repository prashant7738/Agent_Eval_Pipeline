[project]
name = "agent-eval-pipeline"
version = "0.1.0"
description = "Agent evaluation pipeline: ROUGE-L, Bradley-Terry/Elo, SelfCheckGPT, Cohen's kappa"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11.0",
    "python-dotenv>=1.0.0",
    "huggingface_hub>=0.24.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3.0"]
